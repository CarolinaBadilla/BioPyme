name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/vps-deployment
  workflow_dispatch:

# PERMISOS REQUERIDOS PARA SUBIR REPORTES SARIF A GITHUB SECURITY
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==========================================
  # STAGE 1: SECURITY & SAST SCANNING
  # ==========================================
  security:
    name: Security Scans (Gitleaks, Semgrep, Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks: Detección de credenciales
      - name: Run Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Semgrep: Análisis estático (SAST)
      - name: Run Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --sarif --output=semgrep.sarif .
        continue-on-error: true

      - name: Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # 3. Trivy: Escaneo de imágenes de contenedores
      - name: Build Backend Image for Scanning
        run: docker build -t backend:local ./backend

      - name: Run Trivy Vulnerability Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend:local'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Backend SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  # ==========================================
  # STAGE 2: SSH DEPLOYMENT TO VPS
  # ==========================================
  deploy:
    name: Deploy to VPS
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/debian/biopyme/codigo_fuente
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            docker compose build --no-cache
            docker compose up -d
            docker image prune -f